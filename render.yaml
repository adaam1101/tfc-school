services:
  - type: web
    name: tfc-school
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SCHOOL_TIMEZONE
        value: Africa/Algiers
      - key: CLIENT_URL
        value: https://tfcschool.com
      - key: CLIENT_URLS
        value: https://www.tfcschool.com,https://tfc-school.onrender.com
      - key: VITE_API_URL
        value: /api
      - key: VITE_SCHOOL_LOGO
        value: /tfc-logo.png
      - key: NOTIFICATIONS_ENABLED
        value: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
